# Verificaciones en cada pull request. Es el check que debe exigir la
# protección de la rama main para poder fusionar (a mano o con auto-merge).
# También corre al hacer push de las ramas de desarrollo: un PR abierto por
# Actions (pr-automatico.yml) no dispara el evento pull_request, y así el
# check queda igual asociado al último commit del PR.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['ccr-*', 'claude/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Numeración de migraciones sin duplicados
        run: |
          duplicadas=$(ls supabase/migrations | cut -c1-4 | sort | uniq -d)
          if [ -n "$duplicadas" ]; then
            echo "::error::Números de migración repetidos: $duplicadas"
            exit 1
          fi

      - name: Lint y verificaciones de esquema
        run: npm run verificar

      - name: Pruebas del escáner de inspección
        run: npm run probar:escaner

      - name: Compilar
        run: npx vite build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

  # WP0.2 (FASE0.md): comprueba que un usuario de una empresa no puede leer,
  # cambiar, borrar ni crear datos de otra. Corre sobre un Postgres desechable
  # (nunca sobre Supabase) con TODAS las migraciones aplicadas. Si encuentra una
  # fuga, este job falla y el cambio no debe fusionarse.
  aislamiento:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PRUEBAS_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: supabase/tests/aislamiento/package-lock.json

      - name: Instalar dependencias de la prueba
        working-directory: supabase/tests/aislamiento
        run: npm ci

      - name: Construir la base de pruebas (emulación de Supabase + migraciones)
        run: bash supabase/tests/aislamiento/construir-base.sh

      - name: Probar aislamiento entre empresas
        working-directory: supabase/tests/aislamiento
        run: node probar-aislamiento.mjs --detalle

      - name: Guardar el informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-aislamiento
          path: supabase/tests/aislamiento/salida/informe.json
          if-no-files-found: ignore
